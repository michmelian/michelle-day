:root{--olive:#8f7e52;--rose:#b8585c;--cream:#f6e5d3;--wine:#5e2630;--pink:#c47474;--page:#c47474;--btn2-bg:#f6e5d3;--btn2-fg:#5e2630;--btn1-bg:#b8585c;--btn1-fg:#f6e5d3;

.btn:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.btn svg{width:22px;height:22px;flex:none}
.confirm{background:var(--btn1-bg);color:var(--btn1-fg);border-color:var(--btn1-bg)}
.map{background:var(--btn2-bg);color:var(--btn2-fg)}
@media (min-width:600px){body{padding:24px 0}.card{border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(94,38,48,.35)}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
